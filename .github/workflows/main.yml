```yaml
name: Build HvH Minecraft Mod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check project files
        run: |
          echo "Checking project files..."
          ls -la
          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew is missing from the repository root."
            exit 1
          fi

      - name: Build mod
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HvH-Mod-JAR
          path: build/libs/*.jar
          if-no-files-found: error
```
